<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chatbot IA Pro</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github-dark.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
<script>
    
    marked.setOptions({
        highlight: function(code, lang) {
            return hljs.highlightAuto(code).value;
        }
    });
</script>
</head>
    
<body>
    <div id="chat-container">
        <div id="chat-header">
            <div class="status-dot"></div>
            <span>Asistente IA Pro</span>
        </div>
        
        <div id="messages">
            </div>

        <div id="typing-indicator" class="message ai" style="display: none; background: transparent; box-shadow: none; border: none; color: #00fff2;">
            IA está pensando<span>.</span><span>.</span><span>.</span>
        </div>

        <form id="chat-form" id="input-area">
            <div style="display: flex; width: 100%; gap: 10px; padding: 20px; background: #16213e;">
                <input type="text" id="user-input" placeholder="Escribe tu mensaje aquí..." required autocomplete="off">
                <button type="submit" id="send-btn">
                    <svg viewBox="0 0 24 24" width="24" height="24" fill="currentColor">
                        <path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"></path>
                    </svg>
                </button>
            </div>
        </form>
    </div>

    <script>
        const chatForm = document.getElementById('chat-form');
        const userInput = document.getElementById('user-input');
        const messagesDiv = document.getElementById('messages');
        const typingIndicator = document.getElementById('typing-indicator');
        const sendBtn = document.getElementById('send-btn');

        function addMessage(content, isUser) {
            const messageDiv = document.createElement('div');
            messageDiv.classList.add('message');
            messageDiv.classList.add(isUser ? 'user' : 'ai');
            
            if (isUser) {
                messageDiv.textContent = content;
            } else {
                // Usamos marked.parse para que la respuesta de la IA tenga formato
                messageDiv.innerHTML = marked.parse(content);
            }
            
            messagesDiv.appendChild(messageDiv);
            messagesDiv.scrollTop = messagesDiv.scrollHeight;
        }

        chatForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const message = userInput.value.trim();
            if (!message) return;

            // Bloquear entrada y mostrar mensaje del usuario
            addMessage(message, true);
            userInput.value = '';
            userInput.disabled = true;
            sendBtn.disabled = true;
            
            // Mostrar indicador de "IA pensando..."
            typingIndicator.style.display = 'block';
            messagesDiv.scrollTop = messagesDiv.scrollHeight;

            try {
                const response = await fetch('/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ message: message })
                });

                const data = await response.json();
                
                // Ocultar indicador y mostrar respuesta
                typingIndicator.style.display = 'none';
                
                if (data.response) {
                    addMessage(data.response, false);
                } else {
                    addMessage("Error: No se recibió respuesta.", false);
                }
            } catch (error) {
                typingIndicator.style.display = 'none';
                addMessage("Error de conexión con el servidor.", false);
            } finally {
                userInput.disabled = false;
                sendBtn.disabled = false;
                userInput.focus();
            }
        });
    </script>
</body>
</html>
